# "How I got here": older projects grouped by the phases in
# /blog/four-phases-of-a-builder/. `authored_by` is how the code was originally
# built (human, ai-assisted, ai-generated), not the prose around it, and not later
# maintenance. `status` is the state today: Alpha (usable, rough), Active (pushed
# in the last couple of months), Dormant (no recent push), Archived (repo
# archived), Learning (practice work, not a product). Coming soon and Playtesting
# are the two pre-release states. Phase 4 has no items: most of the wall above
# belongs to it.
