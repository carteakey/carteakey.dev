    message: "Glad I stumbled upon your page. So many inspiring projects and an incredibly well built website. Hi Kartikey, I'm Kartik from Vancouver. Nice to meet you. \r\n\r\nBusiness Systems Analyst by profession, product enthusiast, photographer and beer drinker by passion. I'm exploring what I can build with AI with no coding experience. With all the tools available now, I feel I don't have any more excuses so I am exploring, building and learning. \r\nI am very inspired by the Bhagavad Gita reference. Trying to focus on action than the fruits it beings."
