meta:
  title: Agentic Coding Model Tier List
  updated_at: '2026-10-14'
  currency: USD
  methodology: >
    Editorial ranking triangulated across public benchmarks (Artificial Analysis Intelligence Index v4.3.2,
    CursorBench 3.2), original long-horizon repository tasks, ambiguous multi-file work, terminal
    execution, practical harness quality, real developer throughput (TPS), and standard API pricing.
  benchmark_caveat: >
    Coding results belong to model-harness configurations, not base models alone. Harness choice can
    change task success materially, so no single leaderboard determines the tiers. We cross-reference
    public evaluations like the Artificial Analysis Intelligence Index v4.3.2 while adjusting for
    unreleased checkpoints, reasoning latency, and daily developer ergonomics.
  disclaimer: >-
    Prices are standard public list prices per 1M tokens unless a service is subscription-based.
    Preview models are marked as not generally available. Last verified October 14, 2026.
  benchmark_sources:
    - title: "Artificial Analysis Intelligence Index v4.3.2 (10-eval composite: Terminal-Bench 4.0, AA-Briefcase, GDPval)"
      url: https://artificialanalysis.ai/intelligence-index
    - title: CursorBench 3.2 - ambiguous multi-file tasks from real sessions
      url: https://cursor.com/evals
    - title: Artificial Analysis Coding Agent Index methodology
      url: https://artificialanalysis.ai/methodology/coding-agents-benchmarking
    - title: DeepSWE - original long-horizon software engineering tasks
      url: https://arxiv.org/abs/2607.07946
    - title: SWE-Bench Pro
      url: https://arxiv.org/abs/2509.16941
    - title: Harness-Bench
      url: https://arxiv.org/abs/2605.27922
    - title: Claw-SWE-Bench
      url: https://arxiv.org/abs/2606.12344
blunt_winners:
  - title: Best overall
    model: GPT-6 Astra
  - title: Best for hardest long-horizon tasks
    model: Claude Opus 5.5
  - title: Best daily driver
