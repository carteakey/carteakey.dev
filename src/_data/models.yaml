meta:
  title: Agentic Coding Model Tier List
  updated_at: "2026-08-05"
  currency: USD
  methodology: >
    Editorial ranking triangulated across original long-horizon repository tasks,
    ambiguous multi-file work, terminal execution, repository understanding,
    practical harness quality, speed, availability, and standard API cost.
  benchmark_caveat: >
    Coding results belong to model-harness configurations, not base models alone.
    Harness choice can change task success materially, so no single leaderboard
    determines the tiers.
  disclaimer: >
    Prices are standard public list prices per 1M tokens unless a service is
    subscription-based. Preview models are marked as not generally available.
    Last verified August 5, 2026.
  benchmark_sources:
    - title: CursorBench 3.2 - ambiguous multi-file tasks from real sessions
      url: https://cursor.com/evals
    - title: Artificial Analysis Coding Agent Index methodology
      url: https://artificialanalysis.ai/methodology/coding-agents-benchmarking
    - title: Artificial Analysis coding-agent leaderboard
      url: https://artificialanalysis.ai/agents/coding-agents
    - title: DeepSWE - original long-horizon software engineering tasks
      url: https://arxiv.org/abs/2607.07946
    - title: SWE-Bench Pro
      url: https://arxiv.org/abs/2509.16941
    - title: Harness-Bench
      url: https://arxiv.org/abs/2605.27922
    - title: Claw-SWE-Bench
      url: https://arxiv.org/abs/2606.12344

blunt_winners:
  - title: Best overall
    model: GPT-5.6 Sol
  - title: Best for hardest long-horizon tasks
    model: Claude Fable 5
  - title: Best daily driver
    model: Claude Sonnet 5
  - title: Best open-weight frontier
    model: Kimi K3
  - title: Best cheap API
    model: DeepSeek V4 Flash
  - title: Best affordable high-end
    model: DeepSeek V4 Pro
  - title: Best lightweight subagent
    model: GPT-5.6 Luna

tiers:
  - id: s-plus
    label: S+
    description: Frontier coding agents with the strongest long-horizon reliability across repositories, terminals, and multi-file work.
  - id: s
    label: S
    description: Excellent daily drivers that remain dependable on difficult agentic development tasks.
  - id: a
    label: A
    description: Strong models with competitive coding ability, open-weight value, or a useful specialist profile.
  - id: b
    label: B
    description: Excellent workhorses for high-volume, parallel, local, or cost-sensitive coding, with lower peak reliability.
  - id: c
    label: C
    description: Useful in narrower workflows, but materially inconsistent on sustained autonomous repository work.
  - id: d
    label: D
    description: Lightweight or superseded models that should not be primary agents for serious repository work.

