  - title: Best cheap API
    model: DeepSeek V4 Flash
  - title: Best affordable high-end
    model: DeepSeek V4 Pro
  - title: Best lightweight subagent
    model: GPT-6 Luna
tiers:
  - id: s-plus
    label: S+
    description: >-
      Frontier coding agents with the strongest long-horizon reliability across repositories,
      terminals, and multi-file work.
  - id: s
    label: S
    description: Excellent daily drivers that remain dependable on difficult agentic development tasks.
  - id: a
    label: A
    description: >-
      Strong models with competitive coding ability, open-weight value, or a useful specialist
      profile.
  - id: b
    label: B
    description: >-
      Excellent workhorses for high-volume, parallel, local, or cost-sensitive coding, with lower
      peak reliability.
