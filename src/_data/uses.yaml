changelog:
  - date: "2026-09"
    change: "Rebuilt around the current machines, gaming devices, audio, notes and task tools, browsers, and decluttered gear; added the CasaKey homelab map and a Fastfetch + Freeze machine grid."

  - date: "2026-03"
    change: "Added Audio section (AirPods Pro 2, Sennheiser HD 4.50, Crinacle Zero 2, Moondrop Chu 2, Moondrop Quarks DSP); updated peripherals (Dell P3424WEB, Apple Magic Keyboard, Redragon Kumara, Logitech M720, Akai MPK Mini)"

  - date: "2026-02"
    change: "Reorganized into Organize section; added all devices; switched to Bitwarden, Safari/Edge/Firefox, Raindrop.io + Hoarder; replaced GitHub Projects with Notion"

  - date: "2025-02"
    change: "Added GitHub Copilot to development tools"

  - date: "2024-11"
    change: "Upgraded to MacBook Pro M3 Pro from M2"

  - date: "2024-08"
    change: "Switched from Alfred to Raycast"

  - date: "2024-03"
    change: "Started using Polars alongside Pandas"

  - date: "2023-12"
