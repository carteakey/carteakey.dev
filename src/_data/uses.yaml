homelab:
  name: "CasaKey"
  description: "The homelab has grown into a small fleet of Macs, a Raspberry Pi, an old gaming laptop, a NAS, and Yeti when I need a GPU. Most machines connect over Tailscale; Yeti runs my local models."
  network:
    name: "Tailscale"
    description: "Private access between the machines."
  hosts:
    - name: "M1 Air"
      emoji: "💻"
      role: "Personal cloud"
      description: "Docker, MCP servers, agents, photos, and documents."

    - name: "FX505"
      emoji: "🗄️"
      role: "Media and library"
      description: "The long-running CachyOS box for the self-hosted entertainment side."

    - name: "Raspberry Pi"
      emoji: "🍓"
      role: "Always on"
      description: "Monitoring, notifications, and fleet control."

    - name: "Glowdesk"
      emoji: "💾"
      role: "NAS"
      description: "Shared storage for media and the archive."

    - name: "Yeti"
      emoji: "🧠"
      role: "GPU workstation"
      description: "Windows is currently for gaming while I move the rest of my work to CachyOS; its RTX 4070 runs Gemma 4 and Qwen 3.6 MTP locally."
  links:
    - "FX505 ↔ Glowdesk: Ethernet + NFS"
    - "Raspberry Pi → Yeti: Wake-on-LAN"
