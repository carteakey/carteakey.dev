# Folio 004: App Swaps. Heavy apps and the smaller ones that replaced them.
#
# Numbers:
#   - A plain number was measured on my M3 Pro (Oct 29, 2026): resident memory
#     summed across the app's processes, and `du -sh` of the .app bundle.
#   - A number starting with "~" is a typical figure, not my measurement.
#   - `*_mb` fields only drive the bar widths. Leave `ram`/`disk` out when the
#     comparison is meaningless (both tiny, or not the point of the swap).
#   - `on_my_mac: true` only for apps that are actually installed here.
# Every entry supports enabled: true/false.

sections:
  - id: big
    title: "The big three"
  - id: heavy
    title: "The heavyweights"
  - id: smaller
    title: "Smaller wins"

apps:
  # ── The big three ───────────────────────────────────────────────
  - section: big
    was: "Logi Options+"
    was_icon: "/img/app-swaps/logioptionsplus.png"
    was_stack: "Electron, 9 processes"
    now: "OpenLogi"
    now_icon: "/img/app-swaps/openlogi.png"
    now_stack: "Rust, HID++"
    link: "https://openlogi.org"
    install: "brew install --cask openlogi"
    on_my_mac: true
    ram: { was: "411 MB", was_mb: 411, now: "69 MB", now_mb: 69 }
    disk: { was: "518 MB", was_mb: 518, now: "56 MB", now_mb: 56 }
    kept: "Remap, gestures, DPI, scroll."
    lost: "Flow, Smart Actions, older mice."
    enabled: true

  - section: big
    was: "WhatsApp"
    was_icon: "/img/app-swaps/whatsapp.png"
    was_stack: "Web view"
    now: "ZapFast"
    now_icon: "/img/app-swaps/zapfast.png"
    now_stack: "Rust, egui, no browser engine"
    link: "https://github.com/crmne/zapfast"
    install: "brew install --cask crmne/tap/zapfast"
    on_my_mac: true
    ram: { was: "~600 MB – 1.2 GB", was_mb: 900, now: "35 MB", now_mb: 35 }
    disk: { was: "~450 MB", was_mb: 450, now: "112 MB", now_mb: 112 }
    kept: "Chats, media, reactions, QR pairing."
    lost: "Calls, status, official client support."
    enabled: true

