    now_stack: "Rust, egui + librespot"
    link: "https://github.com/crmne/spotifast"
    install: "brew install --cask crmne/tap/spotifast"
    on_my_mac: true
    ram: { was: "~600 MB – 1 GB", was_mb: 800, now: "42 MB", now_mb: 42 }
    disk: { was: "~350 MB", was_mb: 350, now: "60 MB", now_mb: 60 }
