<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31" shape-rendering="crispEdges">
  <!-- Outer bevel 3D frame -->
  <rect x="0" y="0" width="88" height="31" fill="#363959"/>
  <rect x="1" y="1" width="86" height="29" fill="#0b0b14"/>
  <rect x="1" y="1" width="86" height="1" fill="#585e8a"/>
  <rect x="1" y="1" width="1" height="29" fill="#585e8a"/>
  <rect x="1" y="29" width="86" height="1" fill="#050508"/>
  <rect x="86" y="1" width="1" height="29" fill="#050508"/>

  <!-- Background interior -->
  <rect x="2" y="2" width="84" height="27" fill="#131422"/>

  <!-- Left icon panel (x: 2 to 21) -->
  <rect x="2" y="2" width="20" height="27" fill="#181a2e"/>
  <rect x="22" y="2" width="1" height="27" fill="#2d304e"/>

  <!-- Pixel Key Icon inside left panel -->
  <!-- Ring -->
  <rect x="6" y="9" width="11" height="10" fill="#2323e6"/>
  <rect x="8" y="11" width="7" height="6" fill="#181a2e"/>
  <rect x="10" y="13" width="3" height="2" fill="#5472fd"/>
  <!-- Stem -->
  <rect x="11" y="15" width="3" height="9" fill="#3b5bfd"/>
  <!-- Teeth -->
  <rect x="14" y="19" width="3" height="2" fill="#3b5bfd"/>
  <rect x="14" y="22" width="2" height="2" fill="#3b5bfd"/>

  <!-- Top Text: "CARTEAKEY" -->
  <text x="26" y="13" font-family="ui-monospace, monospace" font-size="8.5" font-weight="900" fill="#f8f7f2" letter-spacing="0.3">CARTEAKEY</text>

  <!-- Divider line -->
  <rect x="26" y="16" width="58" height="1" fill="#292c46"/>

  <!-- Bottom Text: ".DEV" and "ONLINE" / "SYS" -->
  <text x="26" y="25" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#5472fd" letter-spacing="0.5">.DEV</text>
  <rect x="52" y="20" width="3" height="3" fill="#22c55e"/>
  <text x="58" y="24" font-family="ui-monospace, monospace" font-size="6" font-weight="bold" fill="#9ca3af" letter-spacing="0.5">ONLINE</text>
