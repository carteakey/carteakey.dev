name: Build and verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site and run checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Only the current tree is needed; old image revisions are not downloaded.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run lint

      - name: Restore generated image cache
        uses: actions/cache@v4
        with:
          path: .cache/image-output
          key: images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build site
        # prebuild runs check:version, check:content, check:design, then Eleventy + Tailwind.
        # No secrets are set here on purpose: every data module must fall back cleanly.
        run: pnpm run build

      - name: Verify built output
        run: pnpm run verify

      # Warn-only Lighthouse pass on the built site (lighthouserc.ci.cjs). It
      # catches a heavier bundle or a new accessibility failure in the diff; the
      # monthly workflow grades production.
      - name: Lighthouse on built site
        continue-on-error: true
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=./lighthouserc.ci.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-${{ github.run_number }}
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
