[build]
  publish = "_site"
  command = "npm run build"
  functions = "netlify/functions"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/js/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Force redirect for blog post URLs with spaces (percent-encoded)
[[redirects]]
  from = "/blog/optimizing gpt-oss-120b-local inference/"
  to = "/blog/optimizing-gpt-oss-120b-local-inference/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/optimizing gpt-oss-120b-local inference"
  to = "/blog/optimizing-gpt-oss-120b-local-inference/"
  status = 301
  force = true

[[plugins]]
package = "netlify-plugin-cache"

  [plugins.inputs]
  paths = [ ".cache" ]
